<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; background: rgba(0, 0, 0, 0.25); height: 100%; }
  .box { font-family: sans-serif; font-size: 22px; color: white; padding: 24px; }
  .swatch { display: inline-block; width: 120px; height: 60px; margin: 6px; border: 2px solid white;
            font-size: 12px; color: white; text-align: center; line-height: 60px; }
</style>
</head>
<body>
  <div class="box">
    This page's &lt;body&gt; background is rgba(0,0,0,0.25). If WebView2 transparency is real,
    the gradient behind the window should be visibly darkened/tinted, not solid gray/white.
    <br /><br />
    <div class="swatch" style="background: rgba(255,0,0,0.5)">rgba red .5</div>
    <div class="swatch" style="background: rgba(0,255,0,0.5)">rgba green .5</div>
    <div class="swatch" style="background: rgba(0,0,255,0.5)">rgba blue .5</div>
    <div class="swatch" style="background: rgba(255,255,255,0.15)">rgba white .15</div>
  </div>
</body>
</html>
